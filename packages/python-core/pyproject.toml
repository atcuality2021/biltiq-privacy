# SPDX-License-Identifier: MIT
# biltiq-privacy — privacy / anonymisation / compliance engine.
# Pinned dependencies are the source of truth here; mirror changes in
# docs/architecture/approved-versions.md in the same PR.

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "biltiq-privacy"
version = "0.1.0"
description = "Privacy, anonymisation, and regulatory-compliance engine for India / EU / US / UK PII. Library-grade, framework-free."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "BiltIQ", email = "engineering@biltiq.ai" },
]
keywords = ["privacy", "pii", "anonymisation", "dpdp", "gdpr", "hipaa", "ccpa", "presidio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# NOTE: en_core_web_sm is NOT a runtime dependency. PyPI rejects direct-URL
# Requires-Dist entries, so the published dist ships without the model
# (ADR-0006). Consumers run `python -m spacy download en_core_web_sm` once,
# or opt into PresidioDetector(auto_download_model=True). The dev/CI path
# keeps the model via [dependency-groups] below.
dependencies = [
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
    "spacy>=3.7,<4",
    "rapidfuzz>=3.0,<4",
]

[project.urls]
Homepage = "https://github.com/atcuality2021/biltiq-privacy"
Repository = "https://github.com/atcuality2021/biltiq-privacy"
Issues = "https://github.com/atcuality2021/biltiq-privacy/issues"

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    # Dev/CI keeps the NER model bundled (dependency groups never reach the
    # published METADATA, so the direct URL is safe here — ADR-0006).
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0.tar.gz",
]

[tool.hatch.build.targets.wheel]
packages = ["biltiq_privacy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["biltiq_privacy"]

# Third-party libraries without published type stubs.
# Presidio Analyzer ships no PEP 561 stubs as of v2.2 (upstream issue
# microsoft/presidio#1199 tracks the gap); the project is type-hinted
# internally but does not export the markers mypy needs to discover them.
# We confine the override to the presidio packages we import.
[[tool.mypy.overrides]]
module = ["presidio_analyzer", "presidio_analyzer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
