# SPDX-License-Identifier: MIT
# biltiq-privacy-workspace -- repo-root metapackage for the biltiq-privacy monorepo.
#
# This file's primary role is wiring AC10 (one-command onboarding from repo root)
# for both supported install paths -- pip (canonical) and uv (opt-in fast path).
# It is NOT published to PyPI; the `Private :: Do Not Upload` classifier is the
# upload guard.
#
# Two install paths, both first-class:
#
#   1. pip (canonical, no extra toolchain required):
#          pip install -e packages/python-core \
#                      -e packages/python-server \
#                      -e .
#      Three editable targets in one shell command. pip resolves
#      biltiq-privacy / biltiq-privacy-server from the local checkouts on
#      disk because they are installed first; the root metapackage then
#      finds them already-present and the [project.dependencies] entries
#      below resolve to the editable installs.
#
#   2. uv (opt-in, faster, lockfile-aware):
#          uv sync
#      [tool.uv.workspace] declares both packages as members; [tool.uv.sources]
#      tells uv to resolve the [project.dependencies] entries below from the
#      workspace rather than from PyPI (where v0.1.0 is not yet published).
#
# Why plain names in [project.dependencies] instead of `file://...` URLs:
#   - pip does not expand uv's `${PROJECT_ROOT}` template variable; the literal
#     URL form in design.html breaks under pip (same `${PROJECT_ROOT}` mismatch
#     that surfaced in BILTIQ-001 Step 3, see design.html change-history).
#   - pip's behaviour on `pip install -e .` is to install the *root* editably
#     but resolve [project.dependencies] entries *non-editably* (even when
#     written as file: URLs). Plain names + pre-installed editable siblings is
#     the only shape that delivers AC10 + a fully editable dev tree under pip.
#
# When BILTIQ-002+ publishes v0.1.0 to PyPI, this file does not change --
# pip's dep resolution finds the local editable siblings before reaching for
# PyPI, and the [tool.uv.sources] override keeps uv on the workspace path.

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "biltiq-privacy-workspace"
version = "0.1.0"
description = "Repo-root metapackage wiring the biltiq-privacy monorepo. Not published to PyPI."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "BiltIQ", email = "engineering@biltiq.ai" },
]
keywords = ["monorepo", "workspace", "metapackage", "biltiq-privacy"]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "biltiq-privacy",
    "biltiq-privacy-server",
]

[project.urls]
Homepage = "https://github.com/atcuality2021/biltiq-privacy"
Repository = "https://github.com/atcuality2021/biltiq-privacy"
Issues = "https://github.com/atcuality2021/biltiq-privacy/issues"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv.workspace]
members = ["packages/python-core", "packages/python-server"]

[tool.uv.sources]
biltiq-privacy = { workspace = true }
biltiq-privacy-server = { workspace = true }

# Transient resolver constraint -- see approved-versions.md for the full rationale.
# spaCy 3.8.14 (released a few days before 2026-05-17) lacks cp314 wheels. pip's
# resolver backtracks to 3.8.13 (which has cp314 wheels); uv's default strategy
# picks the latest in-range and fails. Constraining here keeps the uv path green
# on 3.14 without disturbing pip or the publishable package pins. Remove once
# Explosion publishes cp314 wheels for the next spaCy release.
[tool.uv]
constraint-dependencies = ["spacy<3.8.14"]

# Validates vendored scripts/memory_schemas/ in tests/scripts/test_schemas_load.py
# (BILTIQ-006 AC1). Dev-only; not a runtime dep of biltiq-privacy or -server.
# PEP-735 form mirrors packages/python-core and packages/python-server, so uv
# composes this with the member dev-groups instead of treating workspace-root
# as a competing dev set (which would yank pytest/mypy/ruff at `uv sync`).
[dependency-groups]
dev = [
    "jsonschema>=4.0",
    "types-jsonschema>=4.0",
]

# Repo-root mypy config so the vendored memory-spine modules (`_memory_writer`,
# `_memory_reader`, `_memory_curator` — see ADR-0004) can be type-checked despite
# their byte-equivalent bare `from _paths import _resolve_repo_root, _repo_hash`
# import (writer line ~54). At runtime that works because of a sys.path.insert
# of SCRIPT_DIR earlier in the file, but mypy can't see the runtime mutation —
# it needs a static path. `mypy_path = ["scripts"]` mirrors pytest's `pythonpath`
# convention below: tell each tool where the de-facto import root is so neither
# stumbles on the runtime sys.path manipulation. Required by BILTIQ-006 spine
# vendoring; the alternative (adding `# type: ignore[import-not-found]` to the
# bare import line) would break the byte-equivalence diff gate against the
# plugin v1.10.1 source.
[tool.mypy]
mypy_path = ["scripts"]
explicit_package_bases = true

# Per-file relaxation scoped to the vendored memory-spine modules. The source
# files (`scripts/_memory_{writer,reader,curator}.py`) are pinned byte-equivalent
# to plugin v1.10.1 per ADR-0004; we cannot edit the source to add or update
# `# type: ignore[...]` comments without breaking the byte-equivalence diff gate
# that AC8 enforces at PR-open.
#
# Two specific check categories must be relaxed here:
#
#   1. `misc` — line ~43 of _memory_writer.py: `Draft7Validator = None  # type:
#      ignore[assignment]`. The original plugin source carries `[assignment]`,
#      which an older mypy version raised on this `<type> = None` pattern.
#      Newer mypy raises it as `[misc]` ("Cannot assign to a type") instead;
#      the existing inline ignore code no longer matches.
#
#   2. `no-any-return` — line ~122 of _memory_writer.py: `_load_schema` reads
#      `json.load(f)` (returns `Any`) into `_schema_cache` and returns from the
#      cache; mypy reports the read-back as an Any leak through the declared
#      `dict[str, Any] | None` return type. Same shape will recur in the
#      reader/curator at Steps 4–5.
#
# The override is narrowly module-scoped: tests/scripts/test_memory_writer.py
# and any new non-vendored code under scripts/ (e.g. _check_spine_sync.py at
# Step 8, _backfill_memory_v1_10.py at Step 6) still get full --strict.
[[tool.mypy.overrides]]
module = [
    "scripts._memory_writer",
    "scripts._memory_reader",
    "scripts._memory_curator",
]
disable_error_code = ["misc", "no-any-return"]

# Repo-root pytest config so `pytest` from the repo root collects both packages
# AND the repo-level tooling tests under tests/scripts/ (BILTIQ-003 memory-spine).
#
# `--import-mode=importlib` is required because packages/python-core/tests/
# and packages/python-server/tests/ both contain a file named test_import.py;
# under the legacy `prepend` import mode pytest collides on the duplicate module
# name `tests.test_import`. importlib mode loads each test file as a unique
# anonymous module and is the pytest-recommended import mode for new projects.
#
# `pythonpath` puts both package roots on sys.path so cross-test imports
# (e.g. `from tests.fixtures import india` in packages/python-core/tests/indian/)
# resolve under repo-root pytest. This works in concert with the two `tests/`
# directories being PEP 420 namespace packages (no `__init__.py`) — the
# namespace merges contributions from every `packages/<pkg>/tests/` on
# sys.path, so `tests.fixtures` (from python-core) is reachable without being
# masked by python-server's `tests/`. See BILTIQ-002 reflect.html § test-harness.
#
# test-scaffolds/ is intentionally excluded — those are language-agnostic
# placeholders for SDK tests, not part of the live Python suite.
[tool.pytest.ini_options]
testpaths = [
    "packages/python-core/tests",
    "packages/python-server/tests",
    "tests/scripts",
]
pythonpath = [
    "packages/python-core",
    "packages/python-server",
]
# pytest 8.1+ — switches importlib-mode parent-package discovery from
# directory-walk synthesis to Python's full import system. Required so the
# regular-package `packages/python-core/tests/__init__.py` is honoured under
# repo-root pytest (without this, pytest synthesises a `tests` namespace
# pointing only at the repo-root `tests/` dir and `tests.fixtures` resolves to
# nothing). Default is False; we opt in.
consider_namespace_packages = true
addopts = "-ra --strict-markers --import-mode=importlib"
